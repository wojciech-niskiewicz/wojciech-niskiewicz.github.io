name: Update portfolio badges

on:
  schedule:
    # Runs every Monday at 06:00 UTC. Adjust as you like — cron syntax:
    # minute hour day-of-month month day-of-week
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Scrape badges and render HTML
        run: npm run update

      - name: Commit changes if anything updated
        run: |
          git config user.name "badge-agent"
          git config user.email "actions@users.noreply.github.com"
          git add badges.json badges-section.html
